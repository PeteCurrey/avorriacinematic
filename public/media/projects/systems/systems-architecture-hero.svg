<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#0A0C10" rx="2"/>

  <!-- Zone Headers -->
  <rect x="50" y="40" width="320" height="36" fill="#12151E" stroke="#1D2230" stroke-width="1"/>
  <text x="70" y="63" font-family="monospace" font-size="11" fill="#94A3B8">01 / BUSINESS INPUTS</text>

  <rect x="440" y="40" width="320" height="36" fill="#12151E" stroke="#1D2230" stroke-width="1"/>
  <text x="460" y="63" font-family="monospace" font-size="11" fill="#C8F135">02 / INTELLIGENCE & RULES</text>

  <rect x="830" y="40" width="320" height="36" fill="#12151E" stroke="#1D2230" stroke-width="1"/>
  <text x="850" y="63" font-family="monospace" font-size="11" fill="#38BDF8">03 / ACTIONS & APPROVAL</text>

  <!-- Zone 1: Business Inputs (CRM, History, Activity) -->
  <rect x="50" y="100" width="320" height="540" fill="#0F121A" stroke="#1D2230" stroke-width="1"/>
  <rect x="70" y="130" width="280" height="90" fill="#141924" stroke="#222B3D" stroke-width="1"/>
  <text x="90" y="160" font-family="monospace" font-size="10" fill="#94A3B8">CRM // LEAD 014</text>
  <text x="90" y="185" font-family="sans-serif" font-size="12" fill="#F8FAFC">Status: Open // Inactive 18 Days</text>
  <text x="90" y="205" font-family="monospace" font-size="9" fill="#C8F135">RULE MATCH: FOLLOW-UP DUE</text>

  <rect x="70" y="240" width="280" height="90" fill="#141924" stroke="#222B3D" stroke-width="1"/>
  <text x="90" y="270" font-family="monospace" font-size="10" fill="#94A3B8">CRM // LEAD 027</text>
  <text x="90" y="295" font-family="sans-serif" font-size="12" fill="#F8FAFC">Status: Proposal Sent // Inactive 12 Days</text>
  <text x="90" y="315" font-family="monospace" font-size="9" fill="#94A3B8">STATUS: ACTIVE NURTURE</text>

  <rect x="70" y="350" width="280" height="90" fill="#141924" stroke="#222B3D" stroke-width="1"/>
  <text x="90" y="380" font-family="monospace" font-size="10" fill="#94A3B8">CRM // LEAD 041</text>
  <text x="90" y="405" font-family="sans-serif" font-size="12" fill="#F8FAFC">Status: High-Intent Return to Work Page</text>
  <text x="90" y="425" font-family="monospace" font-size="9" fill="#C8F135">RULE MATCH: PRIORITY INTENT</text>

  <!-- Flow Lines to Centre -->
  <line x1="370" y1="175" x2="440" y2="200" stroke="#C8F135" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="370" y1="395" x2="440" y2="400" stroke="#C8F135" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Zone 2: Intelligence & Rules -->
  <rect x="440" y="100" width="320" height="540" fill="#0F121A" stroke="#1D2230" stroke-width="1"/>
  
  <!-- Rules Sub-node -->
  <rect x="460" y="130" width="280" height="110" fill="#141924" stroke="#C8F135" stroke-width="1"/>
  <text x="480" y="160" font-family="monospace" font-size="10" fill="#C8F135">DETERMINISTIC RULES ENGINE</text>
  <text x="480" y="185" font-family="sans-serif" font-size="11" fill="#F8FAFC">Condition: Last Contact &gt; 14 Days</text>
  <text x="480" y="210" font-family="sans-serif" font-size="11" fill="#F8FAFC">Action: Trigger Value Re-engagement</text>

  <!-- AI Context Sub-node -->
  <rect x="460" y="270" width="280" height="150" fill="#141924" stroke="#222B3D" stroke-width="1"/>
