  <text x="480" y="325" font-family="sans-serif" font-size="11" fill="#F8FAFC">Analyzes past client conversation context,</text>
  <text x="480" y="345" font-family="sans-serif" font-size="11" fill="#F8FAFC">extracts key requirements &amp; formulates</text>
  <text x="480" y="365" font-family="sans-serif" font-size="11" fill="#F8FAFC">tailored, value-led action plan.</text>
  <rect x="480" y="385" width="140" height="20" fill="#C8F135" fill-opacity="0.1"/>
  <text x="490" y="399" font-family="monospace" font-size="9" fill="#C8F135">CONTEXT READY</text>

  <!-- Flow Lines to Action -->
  <line x1="760" y1="345" x2="830" y2="240" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Zone 3: Actions & Approval -->
  <rect x="830" y="100" width="320" height="540" fill="#0F121A" stroke="#1D2230" stroke-width="1"/>
  
  <rect x="850" y="130" width="280" height="190" fill="#141924" stroke="#38BDF8" stroke-width="1"/>
  <text x="870" y="160" font-family="monospace" font-size="10" fill="#38BDF8">PREPARED ACTION // EMAIL DRAFT</text>
  <text x="870" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Subject: Follow-up on System Architecture</text>
  <text x="870" y="215" font-family="sans-serif" font-size="10" fill="#94A3B8">Attached relevant Case Study (NestIQ) &amp;</text>
  <text x="870" y="235" font-family="sans-serif" font-size="10" fill="#94A3B8">proposed next steps consultation.</text>
  
  <rect x="870" y="260" width="120" height="32" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="886" y="280" font-family="monospace" font-size="10" fill="#38BDF8">HUMAN REVIEW</text>

  <!-- Closed Loop Signal -->
  <path d="M 990 400 L 990 600 L 210 600 L 210 460" stroke="#C8F135" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="500" y="590" font-family="monospace" font-size="9" fill="#C8F135">CLOSED LOOP // CRM STATUS UPDATE &amp; FUTURE TRIGGER</text>
</svg>
