<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#0A0B0E"/>
  <!-- Alpine Architectural Vignette and Titanium Bike Geometry -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#alpineGradient)"/>
  
  <!-- Minimalist Flagship Header -->
  <text x="80" y="88" font-family="sans-serif" font-size="22" font-weight="800" fill="#F3F3F0" letter-spacing="4">ALKOTA BIKES</text>
  <text x="1700" y="88" font-family="monospace" font-size="12" font-weight="500" fill="#4D9FFF" letter-spacing="2">TITANIUM // 001</text>
  <line x1="80" y1="120" x2="1840" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Monumental Display Statement -->
  <text x="80" y="320" font-family="sans-serif" font-size="96" font-weight="800" fill="#F3F3F0" letter-spacing="-2">PRECISION TITANIUM</text>
  <text x="80" y="420" font-family="sans-serif" font-size="96" font-weight="800" fill="#4D9FFF" letter-spacing="-2">ENGINEERED FOR EXTREMES.</text>

  <!-- Architectural Frame Silhouette Representation -->
  <path d="M 500 750 L 850 480 L 1250 500 L 1050 780 Z" stroke="#E2E8F0" stroke-width="6" fill="none"/>
  <line x1="850" y1="480" x2="1050" y2="780" stroke="#E2E8F0" stroke-width="6"/>
  <circle cx="500" cy="750" r="160" stroke="#334155" stroke-width="4" fill="none"/>
  <circle cx="1400" cy="750" r="160" stroke="#334155" stroke-width="4" fill="none"/>
  <line x1="1250" y1="500" x2="1400" y2="750" stroke="#E2E8F0" stroke-width="6"/>
  <line x1="1050" y1="780" x2="1400" y2="750" stroke="#E2E8F0" stroke-width="6"/>

  <defs>
    <radialGradient id="alpineGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#07080A"/>
    </radialGradient>
  </defs>
</svg>
